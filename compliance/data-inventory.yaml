# Data inventory — Weft
#
# Change it in the same pull request as any change to what the product stores or sends
# (rules/engineering.md § Privacy and data).

product: weft

tier: prosumer
tier_rationale: >
  Distributed direct to individuals (off-store, free), and it holds site logins, cookies and proxy
  endpoints on the user's machine — the same "may hold credentials" shape as Pipeworks.
  No organisation buys a browser from a small studio within two years; `regulated`
  would be enterprise architecture on a desktop app.

privacy_contact: privacy@walnutlabs.xyz

data:
  - id: browsing-state
    description: Workspaces, their names/colors/icons, open tabs (URL + title), tab groups, recently closed tabs
    classification: confidential
    custodian: user
    purpose: Restore the browser exactly as it was left
    collected: Generated by the app
    storage:
      location: On device (<userData>/state.json)
      encrypted_at_rest: true
      mechanism: macOS FileVault (whole-disk); no app-level encryption
    retention: Until the user closes the tab / workspace; disposable workspaces and private tabs are never written
    deletion: Close the workspace (removes its tabs, env file and partition) or delete <userData>
    leaves_device: false

  - id: workspace-environment
    description: Per-workspace environment — network route, VPN region, proxy host:port, locale, timezone, fingerprint mode, extension toggles, disposable flag
    classification: confidential
    custodian: user
    purpose: Apply the same route/identity to every page in the workspace; portable via git
    collected: Directly from the user
    storage:
      location: On device (<userData>/workspaces/<slug>.env.toml)
      encrypted_at_rest: true
      mechanism: macOS FileVault
    retention: Until the workspace is closed
    deletion: Closing the workspace deletes the file
    leaves_device: false

  - id: site-data
    description: Cookies, local storage, cache, logins and extension data of the pages the user visits, per workspace partition
    classification: restricted
    custodian: user
    purpose: The pages need it; isolation per workspace is the product
    collected: Generated by the pages the user visits
    storage:
      location: On device (Chromium partition <userData>/Partitions/ws-<id>)
      encrypted_at_rest: true
      mechanism: Chromium cookie encryption (Keychain-backed) + FileVault
    retention: Until cleared; disposable partitions and private-tab partitions live in memory only
    deletion: "Clear site data in <workspace>" (per site), close the workspace (whole partition), or close a private tab (its partition)
    leaves_device: false

  - id: vpn-config
    description: WireGuard configuration files the user adds, one per exit region — they contain the user's private key for that tunnel
    classification: restricted
    custodian: user
    purpose: Run a userspace WireGuard tunnel per region so a workspace exits there
    collected: Directly from the user (files placed in the vpn folder)
    storage:
      location: On device (<userData>/vpn/<region>.conf; a derived copy with the local port in <userData>/vpn/.run while a tunnel runs, mode 0600, removed on stop)
      encrypted_at_rest: true
      mechanism: macOS FileVault
    retention: Until the user removes the file
    deletion: Delete the file; stopping the tunnel deletes the derived copy
    leaves_device: false
    note: The key is never logged, never shown in the UI, never sent anywhere; tunnel traffic goes to the endpoint the user's config names.

third_party_flows:
  # Page traffic is not listed: it goes where the user points it, through the route the user
  # chose (direct / their VPN endpoint / their proxy / local Tor). None of it is ours. These are
  # the only requests the app itself makes:
  - recipient: Walnut Labs, via AWS CloudFront + S3 (updates.weftbrowser.com)
    purpose: Self-update. A packaged build fetches latest-mac.yml at launch and every 4 hours, and downloads a newer build when there is one
    data: The request itself — IP address, User-Agent (app version, macOS version), time. No identifier, no cookie, no body
    retention: Not kept. Access logging is off on both the distribution and the bucket; AWS's own edge handling is outside our records
    lawful_basis: Legitimate interest (security updates for a browser)
    opt_out: WEFT_NO_UPDATES=1 for now; a setting is an open item
  - recipient: Walnut Labs, via AWS CloudFront + S3 (weftbrowser.com)
    purpose: Serve the website. Not the app — listed so the policy covers every Weft surface
    data: The request itself (IP, User-Agent, time). No cookies, no scripts from third parties, no analytics
    retention: Not kept. Access logging is off on the distribution and the bucket
    lawful_basis: Legitimate interest (serving the page asked for)
    opt_out: n/a
  - recipient: Google (clients2.google.com, Chrome Web Store)
    purpose: Install an extension the user asked for by Web Store link or id
    data: The extension id, plus the request itself (IP, User-Agent)
    retention: Google's
    lawful_basis: User request
    opt_out: Don't install from the Web Store; unpacked extensions in <userData>/extensions need no request

assertions:
  sells_data: false
  advertising_use: false
  cross_app_tracking: false
  third_party_analytics: false
  pii_in_logs: false
  pii_in_crash_reports: false

app_store_privacy:
  data_collected: []          # off-store; recorded for completeness
  data_linked_to_user: []
  tracking: false

privacy_policy:
  app_name: Weft
  storage_summary: >
    Everything Weft stores lives on your computer: your workspaces, their environments,
    and each workspace's own cookies and site data. Nothing is sent to Walnut Labs.
  sharing_detail: >
    Weft shares nothing. Pages you visit talk to their own servers through the network
    route you chose for that workspace. Weft itself only asks updates.weftbrowser.com
    whether a newer version exists (we keep no logs of it), and Google's Web Store when
    you install an extension from there.
  retention_detail: >
    Data stays until you close the workspace or clear a site; disposable workspaces keep
    nothing on disk at all.

last_reviewed: 2026-11-07
owner: Walnut Labs LLC
