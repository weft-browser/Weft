name: Bug
description: Something Weft does wrong
labels: [bug]
body:
  - type: textarea
    attributes: { label: What happened, description: And what you expected instead. }
    validations: { required: true }
  - type: textarea
    attributes: { label: Steps to reproduce, placeholder: "1. Open a workspace on the VPN route\n2. Press ` t\n3. …" }
    validations: { required: true }
  - type: input
    attributes: { label: Weft version, placeholder: "0.1.2" }
    validations: { required: true }
  - type: input
    attributes: { label: macOS version and Mac, placeholder: "macOS 15.1, M2" }
  - type: markdown
    attributes: { value: "Security problem? Do not file it here: see SECURITY.md." }
