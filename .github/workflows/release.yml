# Version-driven releases. A merge to main that changes app/package.json's version, to one that has
# no tag yet, ships: drive the built app, sign and notarize, publish to updates.weftbrowser.com,
# then tag. A merge that leaves the version alone releases nothing.
#
# Secrets live on the `release` environment (restricted to main), so pull requests never see them:
#   APPLE_DEVID_CERT_P12_B64, APPLE_DEVID_CERT_PASSWORD   Developer ID Application cert (.p12, base64)
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8                 App Store Connect key, for notarization
# and one variable: AWS_PUBLISH_ROLE_ARN, the role assumed through GitHub OIDC (no AWS keys).
name: Release

on:
  push:
    branches: [main]
    paths: ['app/package.json']
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, never cancelled half way: signing and publishing are not safely repeatable.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: is there a new version?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        run: |
          version=$(node -p "require('./app/package.json').version")
          node app/scripts/feed.mjs semver "$version"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then release=false; else release=true; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Weft $version: release=$release" >> "$GITHUB_STEP_SUMMARY"

  package:
    name: drive, sign, notarize
    needs: plan
    if: needs.plan.outputs.release == 'true' && vars.AWS_PUBLISH_ROLE_ARN != ''
    runs-on: macos-15
    environment: release
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the build number is the commit count
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
      # Make sure the Electron binary is there (and branded) even when npm holds install scripts back.
      - run: node node_modules/electron/install.js && node scripts/brand-dev-electron.mjs
      - run: npm run build
      # The gate unit tests cannot be: the built app opens, loads a page and answers the keyboard.
      - name: Drive the built app
        run: node scripts/drive.mjs scripts/smoke.drive
      - name: Keep the driver's screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-shots
          path: app/.drive-shots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Package, sign, notarize
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          APPLE_DEVID_CERT_P12_B64: ${{ secrets.APPLE_DEVID_CERT_P12_B64 }}
          APPLE_DEVID_CERT_PASSWORD: ${{ secrets.APPLE_DEVID_CERT_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: ./scripts/package-ci.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            app/dist/*.dmg
            app/dist/*.zip
            app/dist/*.blockmap
            app/dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 30

  publish:
    name: publish and tag
    needs: [plan, package]
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 20
    permissions:
      id-token: write # GitHub OIDC → the AWS publish role
      contents: write # the tag and the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: app/dist
      - uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5 # v6.3.1
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          role-session-name: github-${{ github.run_id }}
          aws-region: us-east-1
      - name: Publish to updates.weftbrowser.com
        run: ./app/scripts/publish.sh
      # Tagged only once the feed is live, so a tag always means "this version is out".
      - name: Tag and release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Weft $VERSION" --generate-notes
