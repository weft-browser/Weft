# Checks every pull request and main. No secrets are used here, so it is safe for forks.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job ids and names are referenced by branch protection: rename them there too.
  app:
    name: app (check, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: shell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: shell/package-lock.json
      - run: npm ci --no-audit --no-fund
      # The model, the shell, and the fork's controller type-checked against both.
      - run: npm run check
      - run: npm test
      # The chrome://weft bundle, built exactly as the fork packs it.
      - run: npm run build

  chromium:
    name: chromium (scripts, patches)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: chromium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A Chromium build needs ~100 GB and hours, so CI checks what it can without a checkout.
      - name: Scripts parse
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: The pin is a real version
        run: grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' CHROMIUM_VERSION
      - name: Patches are well formed
        run: for p in patches/*.patch; do [ -e "$p" ] || continue; git apply --stat "$p" >/dev/null; done

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner
